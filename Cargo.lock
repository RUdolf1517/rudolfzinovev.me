# This file is intentionally almost empty.
#
# It lists no dependencies on purpose: `cargo` owns this file and will rewrite
# it on the first build, resolving axum and tokio from crates.io. Committing a
# half-guessed lock file with hand-written checksums would be worse than having
# none — a wrong hash fails the build with a checksum error.
#
# To pin the tree afterwards, run once:
#   cargo build --release && git add Cargo.lock
version = 4

[[package]]
name = "rudolfzinovev-me"
version = "0.1.0"
