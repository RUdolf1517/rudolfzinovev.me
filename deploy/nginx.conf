# nginx — alternative reverse proxy (HTTP/2, TLS via certbot).
# cp deploy/nginx.conf /etc/nginx/sites-available/rudolfzinovev.me
# ln -s /etc/nginx/sites-available/rudolfzinovev.me /etc/nginx/sites-enabled/
# certbot --nginx -d rudolfzinovev.me -d www.rudolfzinovev.me

upstream rz_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Brotli is optional: `apt install libnginx-mod-brotli` enables this map.
map $http_accept_encoding $rz_enc {
    default        "";
    "~*gzip"       "gzip";
}

server {
    listen 80;
    listen [::]:80;
    server_name rudolfzinovev.me www.rudolfzinovev.me;
    return 301 https://rudolfzinovev.me$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.rudolfzinovev.me;
    ssl_certificate     /etc/letsencrypt/live/rudolfzinovev.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rudolfzinovev.me/privkey.pem;
    return 301 https://rudolfzinovev.me$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rudolfzinovev.me;

    ssl_certificate     /etc/letsencrypt/live/rudolfzinovev.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rudolfzinovev.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:rz:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    server_tokens off;

    # gzip: the Rust app also compresses; disable here to avoid double work.
    gzip off;

    location / {
        proxy_pass http://rz_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering on;
    }

    location /assets/ {
        proxy_pass http://rz_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~ ^/(cabinet|login|logout) {
        proxy_pass http://rz_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        client_max_body_size 1m;
    }

    access_log /var/log/nginx/rudolfzinovev.access.log;
    error_log  /var/log/nginx/rudolfzinovev.error.log warn;
}
