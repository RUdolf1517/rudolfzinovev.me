[package]
name = "rudolfzinovev-axum"
version = "0.1.0"
edition = "2021"
description = "rudolfzinovev.me on axum: the zero-crate core reused, the HTTP layer replaced"
publish = false

# The project needs four runtime crates from crates.io, which this sandbox
# cannot reach (TLS to index.crates.io and static.crates.io is dropped). Pin the
# versions here and build the workspace with `cargo build -p rudolfzinovev-axum`
# on a machine with normal network access.
#
# Chosen for the "most efficient mainstream Rust stack" answer:
#   axum 0.8  — tower-based, no per-request allocation beyond the task
#   tokio 1   — multi-threaded runtime, epoll/kqueue
#   serde     — only for the JSON backup download; everything else is hand-rolled
#   serde_json
[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "rudolfzinovev-axum"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
